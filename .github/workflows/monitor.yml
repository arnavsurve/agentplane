name: Production Monitoring

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run Health Checks
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/monitor.sh
          ./scripts/monitor.sh
          
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Service Down',
              body: `Production monitoring detected a service failure at ${new Date().toISOString()}
              
              **Action Required:**
              1. Check server status: ssh -i ~/.ssh/id_rsa ec2-user@52.8.122.166
              2. Check container logs: docker logs glyfs-app  
              3. Consider rollback: ./scripts/rollback.sh
              
              **Client Impact:** Asylum Ventures may be affected.
              
              Auto-generated by monitoring workflow.`,
              labels: ['production', 'urgent']
            })
